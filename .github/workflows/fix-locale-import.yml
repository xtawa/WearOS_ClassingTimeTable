name: Fix Locale import

on:
  push:
    branches:
      - redesign/dark-only-ui
    paths:
      - tools/fix_locale_import.py

permissions:
  contents: write

concurrency:
  group: fix-locale-import
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the redesign branch
        uses: actions/checkout@v4
        with:
          ref: redesign/dark-only-ui

      - name: Add the missing import
        run: python3 tools/fix_locale_import.py

      - name: Verify the patched source
        run: |
          set -euo pipefail
          screens=$(git hash-object mobile/src/main/java/com/classing/mobile/timetable/screen/Screens.kt)
          echo "Screens.kt $screens"
          test "$screens" = "6d541ead58a708f96fd3b26a6b30bef91f949eca"

      - name: Commit the import fix
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "Xihao Zhang"
          git config user.email "zeromostia@gmail.com"
          git commit -am "fix: import java.util.Locale for the merged mobile top bar"
          git push origin HEAD:redesign/dark-only-ui
