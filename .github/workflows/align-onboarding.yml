name: Align onboarding

on:
  push:
    branches: [redesign/dark-only-ui]
    paths:
      - tools/patch_onboarding.py

permissions:
  contents: write

concurrency:
  group: align-onboarding
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/dark-only-ui

      - name: Apply patch
        run: python3 tools/patch_onboarding.py

      - name: Verify target hash
        run: |
          set -euo pipefail
          target=mobile/src/main/java/com/classing/mobile/timetable/screen/MobileOnboarding.kt
          actual=$(git hash-object $target)
          echo "actual=$actual"
          test "$actual" = "16c09fe5f36a705527cfb558f1280f7fa6a5fbc8"

      - name: Commit and push
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git config user.name "Xihao Zhang"
          git config user.email "zeromostia@gmail.com"
          git commit -am "redesign: align the onboarding flow with the new header and card language"
          git push origin HEAD:redesign/dark-only-ui
