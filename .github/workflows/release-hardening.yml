name: Release hardening

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-r8:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build optimized release APKs
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleRelease :mobile:assembleRelease
      - name: Verify R8 outputs
        shell: bash
        run: |
          set -euo pipefail

          for module in app mobile; do
            mapping="$module/build/outputs/mapping/release/mapping.txt"
            apk="$module/build/outputs/apk/release/${module}-release.apk"

            if [[ ! -s "$mapping" ]]; then
              echo "Missing or empty R8 mapping file: $mapping" >&2
              exit 1
            fi

            if [[ ! -s "$apk" ]]; then
              echo "Missing release APK: $apk" >&2
              exit 1
            fi

            if unzip -l "$apk" | grep -qE '(^|/)(mapping|seeds|usage|configuration)\.txt$'; then
              echo "R8 diagnostic files must not be packaged inside $apk" >&2
              exit 1
            fi
          done
      - name: Collect R8 diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf r8-artifacts
          mkdir -p r8-artifacts/wear r8-artifacts/mobile

          copy_if_present() {
            local source="$1"
            local destination="$2"
            if [[ -f "$source" ]]; then
              install -m 0600 "$source" "$destination"
            fi
          }

          for file in mapping seeds usage configuration; do
            copy_if_present "app/build/outputs/mapping/release/$file.txt" "r8-artifacts/wear/$file.txt"
            copy_if_present "mobile/build/outputs/mapping/release/$file.txt" "r8-artifacts/mobile/$file.txt"
          done
      - name: Upload R8 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r8-diagnostics-${{ github.sha }}
          path: r8-artifacts/
          if-no-files-found: error
          retention-days: 30
