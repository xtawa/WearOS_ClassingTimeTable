name: Release hardening

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-r8:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build optimized release APKs
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleRelease :mobile:assembleRelease
      - name: Verify R8 outputs
        shell: bash
        run: |
          set -euo pipefail

          for module in app mobile; do
            mapping="$module/build/outputs/mapping/release/mapping.txt"
            apk_dir="$module/build/outputs/apk/release"

            if [[ ! -s "$mapping" ]]; then
              echo "Missing or empty R8 mapping file: $mapping" >&2
              exit 1
            fi

            mapfile -t apks < <(find "$apk_dir" -maxdepth 1 -type f -name '*.apk' -print | sort)
            if [[ "${#apks[@]}" -eq 0 ]]; then
              echo "No release APK found in: $apk_dir" >&2
              exit 1
            fi

            for apk in "${apks[@]}"; do
              if [[ ! -s "$apk" ]]; then
                echo "Release APK is empty: $apk" >&2
                exit 1
              fi

              if unzip -Z1 "$apk" | grep -qE '(^|/)(mapping|seeds|usage|configuration)\.txt$'; then
                echo "R8 diagnostic files must not be packaged inside $apk" >&2
                exit 1
              fi
            done
          done
