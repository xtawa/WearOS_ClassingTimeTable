name: Align week grid

on:
  push:
    branches: [redesign/dark-only-ui]
    paths:
      - tools/patch_grid.py

permissions:
  contents: write

concurrency:
  group: align-grid
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/dark-only-ui
      - name: Apply patch
        run: |
          set -euo pipefail
          python3 tools/patch_grid.py
      - name: Verify hash
        run: |
          set -euo pipefail
          target=db0c6042ead10893ccab6076d99c8879a12226e5
          actual=$(git hash-object mobile/src/main/java/com/classing/mobile/timetable/screen/MobileLayersMain.kt)
          echo "target=$target"
          echo "actual=$actual"
          test "$actual" = "$target"
      - name: Commit
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git config user.name "Xihao Zhang"
          git config user.email "zeromostia@gmail.com"
          git commit -am "redesign: size week grid day columns to the width actually available"
          git push origin HEAD:redesign/dark-only-ui
