name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Download Gradle distribution
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            if ./gradlew --no-daemon --version; then
              exit 0
            fi

            if [[ "$attempt" -eq 3 ]]; then
              echo "Failed to download the Gradle distribution after $attempt attempts." >&2
              exit 1
            fi

            delay=$((attempt * 15))
            echo "Gradle download failed; retrying in ${delay}s..." >&2
            sleep "$delay"
          done
      - name: Run unit tests
        run: ./gradlew --no-daemon --max-workers=1 test
      - name: Run Android lint
        run: ./gradlew --no-daemon --max-workers=1 lint
      - name: Assemble release APKs
        run: ./gradlew --no-daemon --max-workers=2 assembleRelease
      - name: Upload release APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: |
            mobile/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
