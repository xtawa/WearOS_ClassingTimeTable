name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint, and assemble release APKs
        run: ./gradlew --no-daemon --max-workers=2 test lint :app:assembleRelease :mobile:assembleRelease
      - name: Upload R8 mappings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping-${{ github.sha }}
          path: |
            app/build/outputs/mapping/release/
            mobile/build/outputs/mapping/release/
          if-no-files-found: ignore
