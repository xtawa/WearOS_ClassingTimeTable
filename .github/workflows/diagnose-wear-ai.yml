name: Apply Wear home preference fix
on:
  push:
    branches: [feat/wear-ask-ai]
    paths: ['.github/workflows/diagnose-wear-ai.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'missing anchor: {path}')
              file.write_text(text.replace(old, new, 1))

          replace(
              'app/src/main/java/com/classing/wear/timetable/ui/state/HomeUiState.kt',
              '    val heatmapCells: List<HeatmapCell> = emptyList(),\n',
              '    val heatmapCells: List<HeatmapCell> = emptyList(),\n    val showAiOnHome: Boolean = true,\n',
          )
          replace(
              'app/src/main/java/com/classing/wear/timetable/ui/screen/home/HomeViewModel.kt',
              '                    heatmapCells = heatmapCells,\n                    errorMessage = (inputs.syncState as? SyncState.Failed)?.message,\n',
              '                    heatmapCells = heatmapCells,\n                    showAiOnHome = inputs.preferences.showAiOnHome,\n                    errorMessage = (inputs.syncState as? SyncState.Failed)?.message,\n',
          )
          replace(
              'app/src/main/java/com/classing/wear/timetable/ui/screen/home/HomeScreen.kt',
              '        if (state.preferences.showAiOnHome) {\n',
              '        if (state.showAiOnHome) {\n',
          )
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/classing/wear/timetable/ui/state/HomeUiState.kt app/src/main/java/com/classing/wear/timetable/ui/screen/home/HomeViewModel.kt app/src/main/java/com/classing/wear/timetable/ui/screen/home/HomeScreen.kt
          git commit -m 'fix(wear): expose AI home preference in UI state'
          git push origin HEAD:feat/wear-ask-ai
