name: Diagnose Wear Ask AI
on:
  push:
    branches: [feat/wear-ask-ai]
    paths: ['.github/workflows/diagnose-wear-ai.yml']
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Capture compiler output
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --max-workers=1 :app:compileDebugKotlin :app:testDebugUnitTest --stacktrace > ci-wear-ai.log 2>&1
          code=$?
          echo "EXIT_CODE=$code" >> ci-wear-ai.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci-wear-ai.log
          git commit -m 'chore: capture Wear Ask AI CI diagnostics'
          git push origin HEAD:feat/wear-ask-ai
