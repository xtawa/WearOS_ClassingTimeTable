name: Apple CI
on:
  push:
    branches: [main]
    paths: ['apple/**', '.github/workflows/apple-ci.yml']
  pull_request:
    paths: ['apple/**', '.github/workflows/apple-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apple-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: apple
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apple/Preview/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r apple/scripts/requirements.txt
      - run: python -I apple/scripts/check_swift_syntax.py
      - run: python -m unittest discover -s apple/scripts -p 'test_*.py'
      - run: npm ci
        working-directory: apple/Preview
      - run: npm run test:contracts
        working-directory: apple/Preview
      - run: npx playwright install --with-deps chromium
        working-directory: apple/Preview
      - run: npm run test:e2e
        working-directory: apple/Preview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-browser-preview-and-tests
          path: |
            apple/Preview/playwright-report
            apple/Preview/test-results
          if-no-files-found: warn
  native:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: ${{ vars.APPLE_XCODE_PATH || '/Applications/Xcode.app/Contents/Developer' }}
      # iOS 26.5 has a known StoreKit Test configuration regression in CLI tests.
      CLASSING_IOS_SIMULATOR_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-2
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: apple
      - name: Check Apple SDKs
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcrun simctl list runtimes
          test "$(xcodebuild -version | head -1 | awk '{print $2}' | cut -d. -f1)" -ge 26
      - name: Test portable Swift business logic
        run: swift test --package-path apple/ClassingCore --enable-code-coverage
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cp apple/Config/Local.example.xcconfig apple/Config/Local.xcconfig
          xcodegen generate --spec apple/project.yml --project apple
      - name: Compile iPhone app and widgets (unsigned simulator)
        run: >-
          xcodebuild -project apple/Classing.xcodeproj -scheme Classing
          -configuration Debug -destination 'generic/platform=iOS Simulator'
          -derivedDataPath apple/build/ios CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" CODE_SIGNING_ALLOWED=NO build
      - name: Compile Apple Watch app and complications
        run: >-
          xcodebuild -project apple/Classing.xcodeproj -scheme ClassingWatch
          -configuration Debug -destination 'generic/platform=watchOS Simulator'
          -derivedDataPath apple/build/watch CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" CODE_SIGNING_ALLOWED=NO build
      - name: Archive iPhone app with embedded Apple Watch app (unsigned devices)
        run: >-
          xcodebuild -project apple/Classing.xcodeproj -scheme Classing
          -configuration Release -destination 'generic/platform=iOS'
          -derivedDataPath apple/build/device
          -archivePath apple/build/Classing.xcarchive
          CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive
      - name: Package unsigned iPhone and Watch IPA
        run: |
          APP=apple/build/Classing.xcarchive/Products/Applications/Classing.app
          test -d "$APP/Watch/ClassingWatch.app"
          test -d "$APP/PlugIns/ClassingWidgets.appex"
          test -d "$APP/Watch/ClassingWatch.app/PlugIns/ClassingWatchWidgets.appex"
          mkdir -p apple/build/ipa/Payload apple/build/artifacts
          ditto "$APP" apple/build/ipa/Payload/Classing.app
          cd apple/build/ipa
          ditto -c -k --keepParent Payload ../artifacts/Classing-unsigned.ipa
      - name: Upload unsigned iPhone and Watch IPA
        uses: actions/upload-artifact@v4
        with:
          name: apple-unsigned-iphone-watch-ipa
          path: apple/build/artifacts/Classing-unsigned.ipa
          if-no-files-found: error
      - name: Native UI tests and screenshots
        run: bash apple/scripts/native-preview.sh
      - name: Upload native simulator apps and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-native-simulator-builds
          path: |
            apple/build/ios/Build/Products/Debug-iphonesimulator/*.app
            apple/build/watch/Build/Products/Debug-watchsimulator/*.app
            apple/build/screenshots
            apple/build/UITests.xcresult
          if-no-files-found: warn
      - name: Publish CI summary
        if: always()
        run: |
          echo '## Apple validation' >> "$GITHUB_STEP_SUMMARY"
          echo '- Swift core tests, iOS/watchOS simulator builds and native UI tests run on this macOS runner.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Download apple-native-simulator-builds for PNG previews and .xcresult diagnostics.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Download apple-unsigned-iphone-watch-ipa for Classing-unsigned.ipa: the device iPhone app with its embedded Apple Watch app and both widget extensions.' >> "$GITHUB_STEP_SUMMARY"
          echo '- The IPA is unsigned and must be signed with matching provisioning profiles for the phone app, Watch app and extensions before physical-device installation.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Simulator .app bundles remain separate from the device IPA.' >> "$GITHUB_STEP_SUMMARY"
