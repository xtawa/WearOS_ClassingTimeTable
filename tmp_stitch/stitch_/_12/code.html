<body class="min-h-screen flex flex-col items-center justify-center p-6 bg-surface antialiased text-on-surface">
<div class="fixed top-0 w-full z-50 flex items-center justify-between px-6 h-16 bg-[#12131a] text-[#bac3ff] font-['Plus_Jakarta_Sans'] tracking-[-0.02em] font-bold shadow-none transition-colors duration-200">

        </p>
<div class="w-full space-y-4">
<button class="w-full h-14 bg-gradient-to-br from-primary to-primary-container text-on-primary rounded-full font-label font-bold tracking-[0.05em] uppercase hover:bg-surface-bright transition-all shadow-[0px_24px_48px_rgba(12,22,73,0.08)] flex items-center justify-center gap-2">
<span>Go to Dashboard</span>
<span class="material-symbols-outlined text-sm" data-icon="arrow_forward">arrow_forward</span>
</button>
