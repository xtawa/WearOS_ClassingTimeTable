<div class="mb-10 relative">
<div class="absolute inset-0 bg-primary/10 rounded-full blur-3xl transform scale-150"></div>
<div class="w-32 h-32 bg-surface-container-lowest rounded-full flex items-center justify-center relative z-10">
<span class="material-symbols-outlined text-6xl text-primary" data-icon="cloud_sync">cloud_sync</span>
</div>

<div class="absolute -top-4 -right-4 w-12 h-12 bg-tertiary-fixed rounded-full flex items-center justify-center animate-bounce" style="animation-duration: 3s;">

</div>

<span class="material-symbols-outlined text-primary text-lg" data-icon="shield">shield</span>
</div>
</div>

<div class="text-center mb-12 space-y-4 w-full">
<h1 class="font-headline font-extrabold text-4xl text-on-surface tracking-tight leading-tight">
                Cloud Sync <br/>&amp; Backup
            </h1>
<p class="font-body text-base text-on-surface-variant px-4">
                Keep your data safe across all devices. Never lose your schedule, notes, or grades again.
            </p>
</div>

<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center text-primary">
<span class="material-symbols-outlined fill" data-icon="sync">sync</span>
</div>
<div>
<h3 class="font-headline font-semibold text-lg text-on-surface">Enable Cloud Sync</h3>
<p class="font-body text-sm text-on-surface-variant">Recommended for safety</p>
</div>
</div>
<!-- Toggle Switch -->

<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-14 h-7 bg-outline-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
</div>

<p class="font-headline font-medium text-sm text-on-surface-variant uppercase tracking-wider pl-2">Sync Account</p>
<button class="w-full bg-surface-container-lowest rounded-lg p-4 flex items-center gap-4 hover:bg-surface-container transition-colors group">

<div class="flex-grow text-left">
<h4 class="font-headline font-semibold text-base text-on-surface">Sign in to Classing Account</h4>
<p class="font-body text-xs text-on-surface-variant">Tap to connect</p>
</div>
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors" data-icon="chevron_right">chevron_right</span>
</button>
<div class="flex items-center justify-center gap-4 py-2">
<div class="h-px bg-outline-variant/30 flex-grow"></div>
<span class="font-body text-xs text-on-surface-variant font-medium">OR</span>
