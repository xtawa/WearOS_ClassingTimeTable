<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Cloud Sync Setup</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-primary-fixed-variant": "#3a4376",
                      "on-secondary-container": "#b1b3cd",
                      "surface-tint": "#bac3ff",
                      "outline-variant": "#46464f",
                      "on-error": "#690005",
                      "on-background": "#e3e1eb",
                      "surface-container-highest": "#33343c",
                      "on-error-container": "#ffdad6",
                      "secondary-fixed-dim": "#c3c5df",
                      "on-primary": "#232c5e",
                      "on-tertiary-container": "#664f03",
                      "surface-dim": "#12131a",
                      "surface-container": "#1e1f26",
                      "on-surface-variant": "#c6c5d0",
                      "error": "#ffb4ab",
                      "primary-fixed-dim": "#bac3ff",
                      "primary": "#dee0ff",
                      "on-secondary-fixed": "#171a2e",
                      "surface-container-high": "#292931",
                      "on-tertiary": "#3d2e00",
                      "on-surface": "#e3e1eb",
                      "inverse-surface": "#e3e1eb",
                      "surface-container-lowest": "#0d0e14",
                      "on-primary-container": "#464f83",
                      "tertiary-fixed": "#ffdf90",
                      "surface-bright": "#383940",
                      "secondary-container": "#42455b",
                      "primary-fixed": "#dee0ff",
                      "outline": "#90909a",
                      "inverse-primary": "#525b90",
                      "on-primary-fixed": "#0c1649",
                      "inverse-on-surface": "#2f3037",
                      "tertiary-fixed-dim": "#e3c370",
                      "surface-variant": "#33343c",
                      "secondary-fixed": "#dfe1fc",
                      "on-tertiary-fixed-variant": "#584400",
                      "on-tertiary-fixed": "#241a00",
                      "on-secondary-fixed-variant": "#42455b",
                      "surface": "#12131a",
                      "tertiary": "#ffdf8f",
                      "tertiary-container": "#e3c370",
                      "error-container": "#93000a",
                      "surface-container-low": "#1a1b22",
                      "secondary": "#c3c5df",
                      "on-secondary": "#2c2f44",
                      "background": "#12131a",
                      "primary-container": "#bac3ff"
              },
              "borderRadius": {
                      "DEFAULT": "1rem",
                      "lg": "2rem",
                      "xl": "3rem",
                      "full": "9999px"
              },
              "spacing": {},
              "fontFamily": {
                      "headline": ["Plus Jakarta Sans"],
                      "body": ["Plus Jakarta Sans"],
                      "label": ["Plus Jakarta Sans"]
              }
            },
          },
        }
    </script>
<style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .icon-fill { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body antialiased min-h-screen selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<nav class="fixed top-0 w-full z-50 flex items-center justify-between px-6 h-16 bg-[#12131a] dark:bg-[#12131a] border-b-0 shadow-none">
<button aria-label="Go back" class="material-symbols-outlined text-[#bac3ff] hover:bg-[#1e1f26] transition-colors scale-95 duration-200 p-2 rounded-full -ml-2">
            arrow_back
        </button>
<h1 class="font-['Plus_Jakarta_Sans'] tracking-[-0.02em] font-bold text-lg tracking-tight text-[#bac3ff]">Setup Wizard</h1>
<div class="w-10"></div> <!-- Balancing spacer -->
</nav>
<!-- Main Content Area -->
<main class="pt-24 pb-36 px-6 flex flex-col items-center max-w-lg mx-auto relative min-h-screen">
<!-- Ambient Background Glow -->
<div class="absolute top-32 w-[120%] h-64 bg-primary/5 blur-[100px] rounded-full pointer-events-none -z-10"></div>
<!-- Hero Graphic -->
<div class="w-32 h-32 mt-4 mb-10 relative flex items-center justify-center">
<div class="absolute inset-0 bg-surface-tint/5 backdrop-blur-3xl rounded-full border border-outline-variant/10 shadow-[0px_24px_48px_rgba(12,22,73,0.12)]"></div>
<span class="material-symbols-outlined icon-fill text-[80px] text-primary relative z-10 drop-shadow-[0_4px_12px_rgba(222,224,255,0.3)]">
                cloud_sync
            </span>
</div>
<!-- Header Typography -->
<div class="text-center mb-12">
<h2 class="text-3xl font-headline font-extrabold tracking-[-0.02em] text-on-surface mb-3">
                Cloud Sync &amp; Backup
            </h2>
<p class="text-on-surface-variant leading-relaxed max-w-sm mx-auto">
                Securely store your academic profile. Access your schedules and notes continuously across all devices.
            </p>
</div>
<!-- Interactive Settings Card -->
<section class="w-full bg-surface-container-low rounded-[2rem] p-2 shadow-lg mb-8">
<div class="bg-surface-container rounded-[1.5rem] p-5 flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-surface-container-highest flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-2xl icon-fill">cloud_done</span>
</div>
<div>
<h3 class="font-headline font-bold text-on-surface text-lg tracking-tight">Enable Cloud Sync</h3>
<p class="text-on-surface-variant text-sm mt-0.5">Automatic secure backup</p>
</div>
</div>
<!-- Visual Toggle (Active State) -->
<button aria-label="Toggle Sync" class="w-14 h-8 bg-primary rounded-full p-1 flex justify-end items-center cursor-pointer transition-colors shadow-inner">
<div class="w-6 h-6 bg-on-primary rounded-full shadow-[0_2px_4px_rgba(0,0,0,0.2)]"></div>
</button>
</div>
</section>
<!-- Authentication Options -->
<section class="w-full flex flex-col gap-3 mb-12">
<span class="text-[11px] font-headline uppercase tracking-[0.05em] text-on-surface-variant font-bold ml-4 mb-1">
                Link Account
            </span>
<button class="w-full bg-surface-container-high hover:bg-surface-bright transition-colors rounded-full py-4 px-6 flex items-center justify-center gap-3 group">
<span class="material-symbols-outlined text-primary icon-fill group-hover:scale-110 transition-transform">account_circle</span>
<span class="font-bold text-primary tracking-tight">Sign in to Classing Account</span>
</button>
<button class="w-full bg-surface border border-outline-variant/15 hover:bg-surface-container transition-colors rounded-full py-4 px-6 flex items-center justify-center gap-3">
<span class="material-symbols-outlined text-on-surface">public</span>
<span class="font-bold text-on-surface tracking-tight">Continue with Google</span>
</button>
</section>
<div class="flex-grow"></div>
<!-- Primary CTA -->
<button class="w-full bg-gradient-to-br from-[#dee0ff] to-[#bac3ff] text-[#232c5e] rounded-full py-4 px-8 font-extrabold text-lg shadow-[0_8px_24px_rgba(186,195,255,0.15)] hover:scale-[0.98] transition-transform flex justify-center items-center gap-2 mt-4 mb-4">
            Next Step
            <span class="material-symbols-outlined font-bold text-xl">arrow_forward</span>
</button>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-20 px-4 pb-safe bg-[#12131a]/80 dark:bg-[#12131a]/80 backdrop-blur-xl shadow-[0px_-1px_0px_rgba(70,70,79,0.15)] shadow-2xl rounded-t-none">
<!-- Active Tab -->
<button class="flex flex-col items-center justify-center bg-[#bac3ff]/10 text-[#bac3ff] rounded-full px-5 py-1 scale-98 active:opacity-80 transition-transform">
<span class="material-symbols-outlined icon-fill mb-1 text-xl">clock_loader_40</span>
<span class="font-['Plus_Jakarta_Sans'] text-[11px] uppercase tracking-[0.05em] font-bold">Progress</span>
</button>
<!-- Inactive Tabs -->
<button class="flex flex-col items-center justify-center text-[#c6c5d0] px-5 py-1 hover:text-[#dee0ff] transition-all">
<span class="material-symbols-outlined mb-1 text-xl">help_outline</span>
<span class="font-['Plus_Jakarta_Sans'] text-[11px] uppercase tracking-[0.05em] font-medium">Help</span>
</button>
<button class="flex flex-col items-center justify-center text-[#c6c5d0] px-5 py-1 hover:text-[#dee0ff] transition-all">
<span class="material-symbols-outlined mb-1 text-xl">close</span>
<span class="font-['Plus_Jakarta_Sans'] text-[11px] uppercase tracking-[0.05em] font-medium">Cancel</span>
</button>
</nav>
</body></html>
