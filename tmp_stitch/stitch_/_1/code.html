    body {
      min-height: max(884px, 100dvh);
    }

<!-- Note: TopAppBar and BottomNavBar from JSON are suppressed here as per the "Automatic Suppression" rule for Onboarding/Splash screens. -->
<body class="bg-surface-container-low text-on-surface font-body antialiased selection:bg-primary-fixed selection:text-on-primary-fixed min-h-[884px] flex flex-col relative overflow-hidden">
<!-- Atmospheric Ambient Backgrounds -->
<div class="absolute top-[-10%] right-[-20%] w-[500px] h-[500px] bg-primary-fixed-dim rounded-full mix-blend-multiply filter blur-[100px] opacity-40 pointer-events-none"></div>
<div class="absolute bottom-[-10%] left-[-20%] w-[600px] h-[600px] bg-secondary-fixed rounded-full mix-blend-multiply filter blur-[120px] opacity-30 pointer-events-none"></div>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col justify-center px-6 md:px-12 lg:px-24 z-10 relative mt-16">
<!-- Logo / Brand Anchor -->
<div class="mb-12">
<div class="w-24 h-24 bg-surface-container-lowest rounded-[2rem] shadow-[0_8px_32px_rgba(26,27,34,0.04)] flex items-center justify-center transform -rotate-3 transition-transform hover:rotate-0 duration-300">
<span class="material-symbols-outlined text-6xl text-primary drop-shadow-sm" style="font-variation-settings: 'FILL' 1;">school</span>
</div>
</div>
<!-- Asymmetric Editorial Typography -->
<div class="max-w-2xl relative">
<h1 class="font-headline text-[3.5rem] md:text-[5rem] leading-[1.05] tracking-tight text-on-surface font-extrabold mb-6">
                Welcome <br/>
<span class="text-primary block mt-2">to Classing</span>
</h1>
<p class="font-body text-xl md:text-2xl text-on-surface-variant leading-relaxed max-w-md md:max-w-xl font-medium">
                A curated academic experience. <br class="hidden md:block"/>
                Orchestrate your schedule with editorial clarity.
            </p>
</div>
</main>
<!-- Bottom Fixed Action Area -->
<div class="px-6 pb-12 pt-8 w-full max-w-2xl mx-auto z-20">
<!-- CTA using the mandated Glassmorphism gradient rule -->
<button class="w-full group flex items-center justify-between bg-gradient-to-br from-primary to-primary-container text-on-primary rounded-full px-8 py-5 shadow-[0_8px_32px_rgba(36,56,156,0.25)] hover:shadow-[0_12px_40px_rgba(36,56,156,0.35)] transition-all duration-300 active:scale-[0.98]">
<span class="font-headline font-bold text-lg tracking-wide">Get Started</span>
<div class="w-10 h-10 bg-on-primary/20 rounded-full flex items-center justify-center backdrop-blur-sm group-hover:bg-on-primary/30 transition-colors">
<span class="material-symbols-outlined text-on-primary" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</div>
</button>
