<body class="bg-background text-on-background font-body min-h-screen flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar from JSON -->
<header class="fixed top-0 w-full z-50 bg-[#12131a] dark:bg-[#12131a] flex items-center justify-between px-6 h-16 transition-colors shadow-none">
<button class="text-[#bac3ff] hover:bg-[#1e1f26] transition-colors scale-95 duration-200 w-10 h-10 flex items-center justify-center rounded-full focus:outline-none focus:ring-2 focus:ring-primary-container">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-['Plus_Jakarta_Sans'] tracking-[-0.02em] font-bold text-lg tracking-tight text-[#bac3ff]">Setup Wizard</h1>
<div class="w-10 h-10"></div> <!-- Spacer for perfect centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 pt-24 px-6 pb-32 flex flex-col gap-8 max-w-lg mx-auto w-full relative z-10">
<!-- Hero Visual Area: The Digital Curator Style -->
<section class="relative w-full aspect-square rounded-[2rem] bg-surface-container-lowest overflow-hidden flex flex-col items-center justify-center isolate border border-outline-variant/15 p-8 shadow-[0px_24px_48px_rgba(12,22,73,0.08)]">
<!-- Ambient Glow -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[120%] h-[120%] bg-[radial-gradient(circle_at_center,theme(colors.primary-container/0.12)_0%,transparent_60%)] z-0 pointer-events-none"></div>
<!-- Contextual Image -->
<img class="absolute inset-0 w-full h-full object-cover mix-blend-luminosity opacity-40 z-0" data-alt="Abstract deep dark obsidian tech background with glowing cyan and indigo neon lines suggesting digital connection and high speed data transfer" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBBJYn322DGTgCsawmFstzjMAvdtsUHm_h93b3opnvB6xy5YFITbeshJgZCzOlghwTqIkoffg-kcPeKyfdquLSbWgX_RYwaIPIBzv5u6xbu8Jd3c0gTZgvTDk0fOw2IztGbsI-b7xK8maN5k-oS2i3A8jaDnqgglh5rTqRVvaoF2ZM8YWdH-vkvAstJ250qaJT4aTmKgF1kY23lw1nmLqjTxPmEvsNxNCPdArtZjZuw7lyhIygowOsO35q0c-6hEaBkENNSl6fc5I0W"/>
<!-- Glassmorphism Device Container -->
<div class="relative z-10 w-48 h-48 rounded-full bg-surface-tint/5 backdrop-blur-[20px] border border-surface-tint/10 flex items-center justify-center gap-6 shadow-2xl">
<span class="material-symbols-outlined text-5xl text-primary" style="font-variation-settings: 'FILL' 1;">smartphone</span>
<!-- Connection Nodes -->
<div class="flex gap-1.5">
<div class="w-1.5 h-1.5 rounded-full bg-primary/40"></div>
<div class="w-1.5 h-1.5 rounded-full bg-primary/70"></div>
<div class="w-1.5 h-1.5 rounded-full bg-primary"></div>
</div>
<span class="material-symbols-outlined text-5xl text-primary-container" style="font-variation-settings: 'FILL' 1;">watch</span>
</div>
<p class="relative z-10 mt-8 text-on-surface-variant text-sm font-medium tracking-wide">Establishing secure link</p>
</section>
<!-- Status List -->
<section class="flex flex-col gap-4 w-full">
<h2 class="font-label text-[11px] uppercase tracking-[0.05em] text-on-surface-variant mb-1 px-2">Connection Log</h2>
<!-- Active Status Item -->
<div class="flex items-center gap-4 p-5 rounded-[1.5rem] bg-surface-container-high border border-outline-variant/15 shadow-sm transition-all">
<div class="w-10 h-10 rounded-full bg-primary-container/10 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-primary">bluetooth_searching</span>
</div>
<div class="flex-1 flex flex-col justify-center">
<h3 class="font-body text-on-surface text-[15px] font-semibold tracking-tight">Detecting watch type...</h3>
</div>
<!-- Status Indicator (Pending) -->
<div class="w-2.5 h-2.5 rounded-full bg-tertiary shadow-[0_0_8px_theme(colors.tertiary/0.6)] shrink-0"></div>
</div>
<!-- Completed Status Item 1 -->
<div class="flex items-center gap-4 p-5 rounded-[1.5rem] bg-surface-container-low transition-all">
<div class="w-10 h-10 rounded-full flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<div class="flex-1 flex flex-col justify-center">
<h3 class="font-body text-on-surface-variant text-[15px] font-medium tracking-tight opacity-80">Matched: International Version</h3>
</div>
</div>
<!-- Completed Status Item 2 -->
<div class="flex items-center gap-4 p-5 rounded-[1.5rem] bg-surface-container-low transition-all">
<div class="w-10 h-10 rounded-full flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<div class="flex-1 flex flex-col justify-center">
<h3 class="font-body text-on-surface-variant text-[15px] font-medium tracking-tight opacity-80">Sync Protocol: Wear OS App</h3>
</div>
</div>
</section>
</main>
<!-- Fixed Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full p-6 pt-12 bg-gradient-to-t from-background via-background/90 to-transparent z-40 flex justify-center pb-10">
<button class="w-full max-w-sm rounded-full bg-[linear-gradient(135deg,theme(colors.primary)_0%,theme(colors.primary-container)_100%)] text-on-primary font-bold tracking-wide py-4 text-center shadow-[0px_24px_48px_rgba(186,195,255,0.15)] hover:brightness-110 active:scale-[0.98] transition-all focus:outline-none focus:ring-4 focus:ring-primary-container/30">
