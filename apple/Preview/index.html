<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Classing Apple Preview</title><link rel="icon" href="assets/icon.png"><link rel="stylesheet" href="preview.css"></head>
<body>
<header class="studio-header"><div class="brand"><img src="assets/icon.png" alt="Classing 原有应用图标"><div><strong>Classing <span>Apple</span></strong><small>本地交互预览 · 演示数据 · 非原生 SwiftUI</small></div></div><div class="controls"><label>状态<select id="scenario"><option value="normal">普通课表</option><option value="empty">空课表</option><option value="conflict">时间冲突</option></select></label><button id="theme" aria-label="切换深浅色">深色</button><button id="large" aria-label="切换大字体">Aa</button><button id="reset">重置</button></div></header>
<main class="studio">
<section class="phone-region" aria-label="iPhone 演示"><div class="device-label"><span>iPhone · SwiftUI 布局参照</span><span>09:41</span></div><div class="phone"><div class="statusbar"><span>9:41</span><div class="island"></div><span>● ▰</span></div><div class="phone-scroll" id="phone-content" aria-live="polite"></div><nav class="tabbar" aria-label="主导航"><button data-tab="home" class="active"><span>☼</span>今日</button><button data-tab="week"><span>▦</span>课表</button><button data-tab="assistant"><span>✧</span>助手</button><button data-tab="settings"><span>☷</span>设置</button></nav><div class="home-indicator"></div></div></section>
<aside class="companion"><div class="device-label"><span>Apple Watch · 本地同步视图</span></div><div class="watch-shell"><div class="watch-crown"></div><div class="watch-screen"><div class="watch-header"><button id="watch-back" aria-label="手表返回">‹</button><span id="watch-title">Classing</span><time>9:41</time></div><div id="watch-content" class="watch-scroll"></div></div></div><div class="widget-label">WidgetKit · 智能叠放 / 锁屏</div><div id="widget" class="widget glass"></div><div class="preview-note"><strong>你在 Windows 上看到的是交互参照</strong><p>可编辑演示课程、切换页面与状态。这里不处理真实登录、AI 密钥、通知授权或云同步。</p><p>真实 SwiftUI、Liquid Glass 材质、表冠滚动和 WidgetKit 行为，以 GitHub Actions 的原生构建与截图为准。</p><button id="export">导出演示 JSON</button></div></aside>
</main>
<dialog id="editor"><form id="course-form"><div class="dialog-heading"><h2>编辑课程</h2><button type="button" id="close-editor" aria-label="关闭">×</button></div><input type="hidden" name="id"><label>课程名<input name="title" required maxlength="1000"></label><div class="form-row"><label>星期<select name="dayOfWeek"><option value="1">周一</option><option value="2">周二</option><option value="3">周三</option><option value="4">周四</option><option value="5">周五</option><option value="6">周六</option><option value="7">周日</option></select></label><label>地点<input name="location"></label></div><div class="form-row"><label>开始<input name="start" type="time" required></label><label>结束<input name="end" type="time" required></label></div><div class="form-row"><label>开始周<input name="startWeek" type="number" min="1" max="53" required></label><label>结束周<input name="endWeek" type="number" min="1" max="53" required></label></div><p id="form-error" role="alert"></p><button type="submit" class="primary">保存演示课程</button><button type="button" id="delete-course" class="danger">删除课程</button></form></dialog>
<div id="toast" role="status"></div><script type="module" src="preview.mjs"></script></body></html>
