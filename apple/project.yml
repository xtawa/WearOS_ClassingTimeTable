name: Classing
options:
  bundleIdPrefix: com.xtawa.classingtime.apple
  deploymentTarget:
    iOS: '17.0'
    watchOS: '10.0'
  xcodeVersion: '26.0'
  createIntermediateGroups: true
packages:
  ClassingCore:
    path: ClassingCore
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: targeted
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    DEVELOPMENT_TEAM: ''
    CLASSING_API_BASE_URL: 'https://api-classing.underflo.ink'
    GOOGLE_DRIVE_CLIENT_ID: ''
    GOOGLE_DRIVE_REDIRECT_URI: ''
    GOOGLE_DRIVE_CALLBACK_SCHEME: classing-google
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    SWIFT_EMIT_LOC_STRINGS: YES
configFiles:
  Debug: Config/Local.xcconfig
  Release: Config/Local.xcconfig
targets:
  Classing:
    type: application
    platform: iOS
    sources:
      - iOS
      - Shared
      - path: Widgets/WidgetViews.swift
      - path: Fixtures/demo.json
        buildPhase: resources
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xtawa.classingtime.apple
        TARGETED_DEVICE_FAMILY: '1,2'
    info:
      path: Config/iOS-Info.plist
      properties:
        CFBundleDisplayName: Classing
        CFBundleURLTypes:
          - CFBundleURLName: Classing
            CFBundleURLSchemes: [classing]
          - CFBundleURLName: GoogleDrive
            CFBundleURLSchemes: ['$(GOOGLE_DRIVE_CALLBACK_SCHEME)']
        ClassingAPIBaseURL: '$(CLASSING_API_BASE_URL)'
        GoogleDriveClientID: '$(GOOGLE_DRIVE_CLIENT_ID)'
        GoogleDriveRedirectURI: '$(GOOGLE_DRIVE_REDIRECT_URI)'
        ClassingProMonthlyID: '$(CLASSING_PRO_MONTHLY_ID)'
        ClassingProYearlyID: '$(CLASSING_PRO_YEARLY_ID)'
        UIApplicationSupportsIndirectInputEvents: true
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        NSCameraUsageDescription: 拍摄课程表并在你确认后进行识别导入。
        NSMicrophoneUsageDescription: 录制你主动发起的语音问题。
        NSSpeechRecognitionUsageDescription: 使用设备端语音识别输入课程表问题。
        NSCalendarsFullAccessUsageDescription: 导入你选择的日历，并管理 Classing 自己创建的课表日历。
        BGTaskSchedulerPermittedIdentifiers: [com.xtawa.classingtime.apple.refresh]
        UIBackgroundModes: [fetch]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    entitlements:
      path: Config/iOS.entitlements
      properties:
        com.apple.security.application-groups: [group.com.xtawa.classingtime.apple]
    dependencies:
      - package: ClassingCore
      - target: ClassingWatch
        embed: true
      - target: ClassingWidgets
        embed: true
  ClassingWatch:
    type: application
    platform: watchOS
    sources:
      - watchOS
      - Shared
      - path: Fixtures/demo.json
        buildPhase: resources
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xtawa.classingtime.apple.watchkitapp
        SDKROOT: watchos
        TARGETED_DEVICE_FAMILY: '4'
        SKIP_INSTALL: YES
    info:
      path: Config/watchOS-Info.plist
      properties:
        CFBundleDisplayName: Classing
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.xtawa.classingtime.apple
        WKRunsIndependentlyOfCompanionApp: true
        ClassingAPIBaseURL: '$(CLASSING_API_BASE_URL)'
        CFBundleURLTypes:
          - CFBundleURLName: Classing
            CFBundleURLSchemes: [classing]
    entitlements:
      path: Config/watchOS.entitlements
      properties:
        com.apple.security.application-groups: [group.com.xtawa.classingtime.apple]
    dependencies:
      - package: ClassingCore
      - target: ClassingWatchWidgets
        embed: true
  ClassingWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - path: Shared/Persistence.swift
      - path: Shared/AgendaDesign.swift
      - path: Shared/CourseActivity.swift
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xtawa.classingtime.apple.widgets
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Config/Widgets-Info.plist
      properties:
        CFBundleDisplayName: Classing Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/Widgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.xtawa.classingtime.apple]
    dependencies:
      - package: ClassingCore
  ClassingWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - Widgets
      - path: Shared/Persistence.swift
      - path: Shared/AgendaDesign.swift
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xtawa.classingtime.apple.watchkitapp.widgets
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Config/WatchWidgets-Info.plist
      properties:
        CFBundleDisplayName: Classing Watch Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/WatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.xtawa.classingtime.apple]
    dependencies:
      - package: ClassingCore
  ClassingUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
      - path: Config/ClassingTest.storekit
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xtawa.classingtime.apple.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Classing
    dependencies:
      - target: Classing
schemes:
  Classing:
    build:
      targets:
        Classing: all
        ClassingUITests: [test]
    test:
      targets: [ClassingUITests]
      gatherCoverageData: true
  ClassingWatch:
    build:
      targets:
        ClassingWatch: all
